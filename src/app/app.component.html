<a class="shell__skip" href="#main">Skip to Pokédex</a>
<header class="shell__header">
  <a class="shell__brand" href="#main"
    ><img src="/assets/pokemon-fallback.svg" width="36" height="36" alt="" /><span
      >Mini <b>Pokédex</b></span
    ></a
  >
  <nav aria-label="Main navigation">
    <a href="#pokedex-title">Browse Pokémon</a><a href="#teams-title">Your teams</a>
  </nav>
</header>
<main class="shell__main" id="main">
  <div class="shell__intro">
    <h1>Browse Pokémon. Build your team.</h1>
    <p>Explore base stats, discover abilities, and find your six.</p>
  </div>
  <div class="shell__workspace">
    <app-pokemon-table
      [selectedId]="panelOpen() ? (selectedPokemon()?.id ?? null) : null"
      (selected)="selectPokemon($event)"
    /><app-team-panel />
  </div>
  <footer class="shell__footer">
    <span
      >Pokémon data from
      <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></span
    ><span>Team data is kept until the mock server restarts.</span>
  </footer>
</main>
@if (panelOpen()) {
  @if (selectedPokemon(); as pokemon) {
    <app-pokemon-detail id="pokemon-detail" [pokemon]="pokemon" (close)="closeDetails()" />
  }
}
