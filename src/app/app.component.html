<a class="shell__skip" href="#main">Skip to Pokédex</a>
<div class="shell" [class.shell--detail]="panelOpen()">
  <header class="shell__topbar">
    <a class="shell__brand" href="#main"
      ><span class="pokeball-mark" aria-hidden="true"></span><span>Pokédex</span></a
    >
    <nav aria-label="Main navigation">
      <a href="#pokedex-title">Browse</a><a href="#teams-title">Your teams</a>
    </nav>
  </header>
  <main class="device" id="main">
    <app-pokedex-header [status]="catalogue().status" />
    <div class="device__body">
      <div class="device__left">
        <app-pokemon-scanner
          [catalogue]="catalogue()"
          [pokemon]="currentPokemon()"
          [canAdd]="canAdd()"
          (inspect)="selectPokemon($event)"
          (step)="movePokemon($event)"
          (search)="focusSearch()"
          (buildTeam)="addCurrentPokemon()"
        />
        @if (draftMessage()) {
          <div class="feedback" role="status">
            {{ draftMessage() }} <a href="#builder-title">View draft</a>
          </div>
        }
        <app-pokemon-table
          [selectedId]="panelOpen() ? (selectedPokemon()?.id ?? null) : null"
          (selected)="selectPokemon($event)"
        />
      </div>
      <div class="device__hinge" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="device__right">
        <app-team-panel />
      </div>
    </div>
    <footer class="device__footer">
      <span
        >Data by
        <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></span
      ><span>Demo teams are temporary.</span>
    </footer>
  </main>
</div>
@if (panelOpen()) {
  @if (selectedPokemon(); as pokemon) {
    <app-pokemon-detail
      id="pokemon-detail"
      [pokemon]="pokemon"
      [addLabel]="addLabel()"
      [canAdd]="canAdd()"
      [draftCount]="draft.selectedIds().length"
      (addToDraft)="addCurrentPokemon()"
      (close)="closeDetails()"
    />
  }
}
