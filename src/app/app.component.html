<a class="shell__skip" href="#main">Skip to Pokédex</a>
<div class="shell" [class.shell--detail]="panelOpen()">
  <main class="device" id="main">
    <app-pokedex-header />
    <div class="device__body">
      <div class="device__left">
        <app-pokemon-scanner
          [catalogue]="catalogue()"
          [pokemon]="currentPokemon()"
          [canAdd]="canAdd()"
          (inspect)="selectPokemon($event)"
          (step)="movePokemon($event)"
          (search)="focusSearch()"
          (buildTeam)="addCurrentPokemon()"
        />
        @if (draftMessage()) {
          <div class="feedback" role="status">
            {{ draftMessage() }} <a href="#builder-title">View draft</a>
          </div>
        }
        <app-pokemon-table
          [selectedId]="currentPokemon()?.id ?? null"
          [draftIds]="draft.selectedIds()"
          [draftBusy]="draft.isSubmitting() || draft.teamState().busy"
          (selected)="featurePokemon($event)"
          (inspected)="selectPokemon($event)"
          (added)="draft.addPokemon($event)"
        />
      </div>
      <div class="device__right">
        <app-team-panel />
      </div>
    </div>
  </main>
</div>
@if (panelOpen()) {
  @if (selectedPokemon(); as pokemon) {
    <app-pokemon-detail
      id="pokemon-detail"
      [pokemon]="pokemon"
      [addLabel]="addLabel()"
      [canAdd]="canAdd()"
      [draftCount]="draft.selectedIds().length"
      (addToDraft)="addCurrentPokemon()"
      (close)="closeDetails()"
    />
  }
}
