<div
  class="portrait"
  [style.--tilt-x]="tilt().x + 'deg'"
  [style.--tilt-y]="tilt().y + 'deg'"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="resetTilt()"
>
  <div class="portrait__target" aria-hidden="true"><span></span></div>
  @if (imageUnavailable()) {
    <span class="portrait__loading" role="status"
      ><span>Image unavailable</span
      ><button class="button button--small" type="button" (click)="retryImage()">
        Retry image
      </button></span
    >
  } @else if (!imageLoaded()) {
    <span class="portrait__loading" role="status"
      ><span class="spinner" aria-hidden="true"></span><span>Loading image…</span></span
    >
  }
  <img
    class="portrait__image"
    [style.visibility]="imageUnavailable() ? 'hidden' : 'visible'"
    [src]="imageUrl()"
    [alt]="pokemon().name + ' illustration'"
    width="240"
    height="240"
    (load)="imageLoaded.set(true)"
    (error)="onImageError()"
  />
  @for (record of [pokemon()]; track record.id) {
    <div class="portrait__pixels" aria-hidden="true">
      @for (pixel of pixels; track pixel) {
        <i [style.animation-delay.ms]="(pixel * 17) % 85"></i>
      }
    </div>
  }
  <span class="portrait__corner portrait__corner--top" aria-hidden="true"></span
  ><span class="portrait__corner portrait__corner--bottom" aria-hidden="true"></span>
</div>
