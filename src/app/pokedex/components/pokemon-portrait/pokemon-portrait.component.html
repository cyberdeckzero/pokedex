<div
  class="portrait"
  [style.--tilt-x]="tilt().x + 'deg'"
  [style.--tilt-y]="tilt().y + 'deg'"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="resetTilt()"
>
  <div class="portrait__target" aria-hidden="true"><span></span></div>
  @if (imageUnavailable()) {
    <div class="portrait__loading" role="status">
      <span>Image unavailable</span>
      <button class="button button--small" type="button" (click)="retryImage()">Retry image</button>
    </div>
  } @else if (!imageLoaded()) {
    <div class="portrait__loading" role="status">
      <app-skeleton kind="image" />
      <span class="visually-hidden">Loading image…</span>
    </div>
  }
  <img
    class="portrait__image"
    [style.visibility]="imageUnavailable() || !imageLoaded() ? 'hidden' : 'visible'"
    [src]="imageUrl()"
    [alt]="pokemon().name + ' illustration'"
    width="240"
    height="240"
    (load)="imageLoaded.set(true)"
    (error)="onImageError()"
  />
  <span class="portrait__corner portrait__corner--top" aria-hidden="true"></span
  ><span class="portrait__corner portrait__corner--bottom" aria-hidden="true"></span>
</div>
